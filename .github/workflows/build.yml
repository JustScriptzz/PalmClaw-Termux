name: Build PalmClaw Terminal

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-bootstrap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        arch: [ aarch64, arm, i686, x86_64 ]

    steps:
      - name: Clone termux-packages
        run: git clone --depth 1 https://github.com/termux/termux-packages.git termux-packages

      - name: Add swap space
        continue-on-error: true
        run: |
          set +e
          sudo dd if=/dev/zero of=/swapfile bs=1M count=8192 status=progress
          sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile
          free -h

      - name: Write package-name override
        run: |
          mkdir -p "$HOME/.config/termux"
          printf 'TERMUX_APP__PACKAGE_NAME="com.palmclaw.termux"\n' > "$HOME/.config/termux/termuxrc.sh"

      - name: Patch build-bootstraps.sh
        working-directory: termux-packages
        run: |
          # Remove defunct standalone bzip2 (absorbed into libbz2)
          sed -i '/PACKAGES+=("bzip2")/d' scripts/build-bootstraps.sh
          # Redirect final zip to /home/builder/ (writable) instead of mounted volume (not writable by builder user)
          sed -i 's|mv -f "${BOOTSTRAP_TMPDIR}/bootstrap-${1}.zip" "$TERMUX_PACKAGES_DIRECTORY/"|mv -f "${BOOTSTRAP_TMPDIR}/bootstrap-${1}.zip" "/home/builder/bootstrap-${1}.zip"|' \
            scripts/build-bootstraps.sh
          grep -n 'bootstrap-.*\.zip' scripts/build-bootstraps.sh | tail -3

      - name: Workaround xorg.freedesktop.org TLS cert issue
        working-directory: termux-packages
        run: |
          sed -i \
            's/--location           # Follow redirects/--location           # Follow redirects\n\t\t$( [[ "$URL" == *xorg.freedesktop.org* ]] \&\& echo --insecure )/' \
            scripts/build/termux_download.sh

      - name: Fix termux-am Android SDK (redirect to writable dir + pre-accept licenses)
        working-directory: termux-packages
        run: |
          sed -i \
            's/\texport ANDROID_HOME/\tmkdir -p "$HOME\/palmclaw-android-sdk\/licenses"\n\tprintf "8933bad161af4178b1185d1a37fbf41ea5269c55\\n24333f8a63b6825ea9c5514f83c2829b004d1fee\\nd56f5187479451eabf01fb78af6dfcb131a6481e\\n" > "$HOME\/palmclaw-android-sdk\/licenses\/android-sdk-license"\n\tprintf "84831b9409646a918e30573bab4c9c91346d8abd\\n" > "$HOME\/palmclaw-android-sdk\/licenses\/android-sdk-preview-license"\n\texport ANDROID_HOME="$HOME\/palmclaw-android-sdk"/' \
            packages/termux-am/build.sh
          grep -n -A2 "palmclaw-android-sdk" packages/termux-am/build.sh | head -6

      - name: Build bootstrap for ${{ matrix.arch }}
        working-directory: termux-packages
        run: |
          set -o pipefail
          TERMUX_DOCKER_RUN_EXTRA_ARGS="--volume $HOME/.config/termux/termuxrc.sh:/home/builder/.config/termux/termuxrc.sh --env MAKEFLAGS=-j2" \
            ./scripts/run-docker.sh ./scripts/build-bootstraps.sh --architectures ${{ matrix.arch }} 2>&1 | tee "$RUNNER_TEMP/bootstrap-build-${{ matrix.arch }}.log"

      - name: Extract bootstrap zip from container
        working-directory: termux-packages
        run: |
          docker cp "termux-package-builder:/home/builder/bootstrap-${{ matrix.arch }}.zip" \
            "$RUNNER_TEMP/bootstrap-${{ matrix.arch }}.zip"
          ls -lh "$RUNNER_TEMP/bootstrap-${{ matrix.arch }}.zip"

      - name: Upload bootstrap artifact
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-zip-${{ matrix.arch }}
          path: ${{ runner.temp }}/bootstrap-${{ matrix.arch }}.zip
          if-no-files-found: error

      - name: Publish build log to ci-logs branch
        if: always()
        continue-on-error: true
        run: |
          set +e
          git clone --depth 1 --branch ci-logs "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-logs-repo 2>/dev/null
          if [ ! -d ci-logs-repo ]; then
            git clone --depth 1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-logs-repo
            cd ci-logs-repo; git checkout --orphan ci-logs; git rm -rf . >/dev/null 2>&1
          else
            cd ci-logs-repo
          fi
          git config user.email "ci-bot@local"; git config user.name "CI Bot"
          mkdir -p logs
          cp "${{ runner.temp }}/bootstrap-build-${{ matrix.arch }}.log" "logs/bootstrap-${{ matrix.arch }}-${{ github.run_id }}.log" 2>/dev/null || echo "no log" > "logs/bootstrap-${{ matrix.arch }}-${{ github.run_id }}.log"
          cp "logs/bootstrap-${{ matrix.arch }}-${{ github.run_id }}.log" "logs/bootstrap-${{ matrix.arch }}-latest.log"
          git add logs/
          git commit -m "Log ${{ matrix.arch }} run ${{ github.run_id }}" || true
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          for i in 1 2 3 4 5; do git push origin ci-logs && break; git pull --rebase origin ci-logs; sleep $((RANDOM%5+1)); done

  build-app:
    needs: build-bootstrap
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download bootstrap artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bootstrap-zip-*
          path: bootstrap-artifacts
          merge-multiple: false

      - name: Place bootstrap zips for Gradle
        run: |
          mkdir -p app/src/main/cpp
          for arch in aarch64 arm i686 x86_64; do
            src=$(find bootstrap-artifacts -name "bootstrap-${arch}.zip" | head -1)
            [ -z "$src" ] && echo "Missing $arch" && exit 1
            cp "$src" "app/src/main/cpp/bootstrap-${arch}.zip"
          done
          ls -lh app/src/main/cpp/

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-termux-${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}
          restore-keys: gradle-termux-${{ runner.os }}-

      - name: Build debug APK
        id: build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log
        continue-on-error: true

      - name: Upload APK artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: palmclaw-terminal-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
